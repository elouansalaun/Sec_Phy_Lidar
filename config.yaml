project:
  name: "lidar-project"
  random_seed: 42

paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"

lidar:
  crs: "EPSG:2950"
  vertical_datum: "CGVD28"   # à confirmer à l'étape 3
  data_extent: [295000, 5039000, 297000, 5041000]

site:
  gpkg: "data/site/site.gpkg"               # dessiné dans QGIS (entrée)
  output_gpkg: "data/site/site_derive.gpkg" # généré (sortie)
  grid_yaml: "data/site/grid.yaml"          # emprise calée sur la grille (sortie)
  weights_csv: "data/site/poids.csv"
  figure: "data/site/site.png"
  approach_ring_m: 15      # largeur de l'anneau d'approche autour des actifs
  study_buffer_m: 400      # portée max capteurs + marge
  resolution_m: 1.0        # résolution des rasters
  tolerance_m: 0.5         # tolérance géométrique des contrôles

rasters:
  tiles_glob: "data/raw/*.LAZ"
  out_dir: "data/processed/rasters"
  chunk_size: 5000000
  fill_max_distance_px: 100     # rayon max de comblement des trous du MNT/MNS
  classes:
    sol: [2]
    batiment: [6]
    autre: [1]                  # végétation + objets (non séparés par le MRNF)
    pont: [17]
    bruit: [7]                  # exclu de tous les produits

validation:
  out_dir: "data/processed/validation"
  margin_m: 50                   # marge autour du périmètre pour la zone de test PDAL
  pdal_ref: "data/processed/validation/mnt_pdal.tif"
  mrnf_ref: "data/external/mnt_mrnf.tif"   # tuile MNT téléchargée sur la carte du MRNF

candidates:
  output: "data/site/candidats.gpkg"
  mat:
    spacing_perimeter_m: 20      # espacement des mâts le long de la clôture
    inset_m: 1.0                 # recul vers l'intérieur de la clôture
    spacing_interior_m: 25       # grille de mâts à l'intérieur
    min_dist_building_m: 2.0
    heights_m: [4, 6, 8, 10]
    cost_base: 1.0
    cost_per_m: 0.10
  toit:
    inset_m: 1.5                 # recul depuis le bord du toit
    simplify_m: 2.0              # simplification des emprises -> coins
    heights_m: [2, 4]
    cost_base: 0.8
    cost_per_m: 0.10



viewshed:
  radius_m: 400            # portée max des capteurs (= study_buffer_m)
  target_height_m: 1.0     # centre du torse d'un intrus debout
  veg_min_h_m: 0.3         # sous ce seuil, "autre" = sol (herbe, bordures)
  out_dir: "data/processed/viewshed"


sensors:
  cameras:
    - {name: cam_grand_angle, n_h: 1920, n_v: 1080, hfov_deg: 90, ppm_50: 25.0, alpha: 1.0, cost: 1.0}
    - {name: cam_standard,    n_h: 1920, n_v: 1080, hfov_deg: 60, ppm_50: 25.0, alpha: 1.0, cost: 1.0}
    - {name: cam_tele,        n_h: 1920, n_v: 1080, hfov_deg: 30, ppm_50: 25.0, alpha: 1.0, cost: 1.3}
  camera_azimuths_deg: [0, 45, 90, 135, 180, 225, 270, 315]
  radars:
    - {name: radar_perimetre, r90_m: 150.0, p_fa: 1.0e-6, elev_max_deg: 15.0, alpha: 0.3, cost: 5.0}
  radar_tilts_deg: [0,5,10,15]

coverage:
  p_min: 0.01                    # P < p_min -> 0 dans la matrice creuse (perte mesurée)
  out_dir: "data/processed/coverage"


optimisation:
  out_dir: "data/processed/optim"
  figures_dir: "figures"         # figures versionnées (reprises dans le README)
  capacite_support:            # nombre max de capteurs par support (c, h)
    radar: 1
    camera: 4
  budget:
    min: 2.0
    max: 30.0
    pas: 1.0
  analyse_budgets: [4, 13, 30]  # budgets cartographiés par src.analyse
  milp:                        # coupes sous-modulaires multi-blocs (src/milp.py)
    bloc_m: 10.0                 # côté des blocs spatiaux : plus petit = coupes plus fortes, maître plus gros
    ecart_cible: 5.0e-3          # arrêt quand (UB − LB) / UB ≤ 0,5 %
    temps_maitre_s: 120          # limite par résolution du maître
    temps_max_s: 900             # limite par budget


intrus:                          # évaluation par l'intrus (docs/formulation.md, §7)
  out_dir: "data/processed/intrus"
  bande_ext_m: 30.0              # bande extérieure incluse dans le domaine (0 = cas dégénéré §7.1)
  cible_contact_m: 1.5           # cible = cellules intérieures à moins de d_t de l'actif cible_intrus
  vitesse_m_s: 1.5               # marche
  tau_obs_s: 1.0                 # intervalle entre observations indépendantes (hypothèse)
  tau_obs_sensibilite_s: [0.5, 1.0, 5.0]
  t_cloture_s: 10.0              # temps d'escalade du grillage de 2,5 m, exposé (hypothèse)
  t_portail_s: 3.0               # temps de passage d'un portail fermé (hypothèse)
  pi_portail: 0.8                # part d'intrus opportunistes (portails seulement) — hypothèse
  t_reponse_s: [0, 10, 20, 30, 45, 60, 120]   # temps de réponse T_R, détection opportune (§9.1) — hypothèses
  objectif_nsga: "pire_cas"      # "pire_cas" (p*_F) ou "melange" (D_pi), voir §7.3


nsga:                            # NSGA-II multi-objectif (src/nsga.py, étape 4.5)
  out_dir: "data/processed/nsga"
  population: 100
  generations: 200
  graines: [1, 2, 3, 4, 5]
  p_croisement: 0.9
  amorcage_s3: true              # les 58 solutions MILP et gloutonnes de la semaine 3
  k_couverture:                  # équipements vus par ≥ k capteurs à P ≥ p_min sur part_min des cellules
    k: 2
    p_min: 0.5
    part_min: 0.9
    zones: [4, 5]                # indices de la couche couverture : Gaz Bat.3, Générateur
    contrainte: false            # true : contrainte de NSGA-II ; false : indicateur seulement


boucle:                          # boucle adversariale exacte par génération de chemins (§9.2)
  out_dir: "data/processed/boucle"
  profil: "F"                    # menace de référence : intrus déterminé
  theta: [0.5, 0.9, 0.95]        # détection opportune garantie exigée
  t_reponse_s: [0, 10, 20, 30]   # au-delà de T_min ≈ 30 s : irréalisable (§9.1, proposition 2)
  theta_produit: [0.9]           # cas où l'on encadre aussi l'optimum sous indépendance
  chemins_par_iteration: 20      # couloirs disjoints renvoyés par l'intrus à chaque itération
  temps_maitre_s: 300
  temps_max_s: 1800              # par cas, fusion « max » (optimum certifié)
  temps_produit_s: 600           # par cas, fusion « produit » (encadrement)
  prix:                          # prix de la robustesse certifié : F max libre vs F max robuste
    - {budget: 16, theta: 0.95, t_reponse_s: 0}
    - {budget: 19, theta: 0.95, t_reponse_s: 0}
    - {budget: 20, theta: 0.9, t_reponse_s: 10}
    - {budget: 30, theta: 0.9, t_reponse_s: 20}

surrogate:                       # modèle de substitution : carte de potentiel (docs/formulation.md, §8)
  out_dir: "data/processed/surrogate"
  rayon_m: 150                   # R : portée utile (R90 du radar, caméra télé ≈ 143 m)
  anneaux_m: [0, 50, 150]        # anneaux de distance (grand angle ≈ 38 m, standard ≈ 67 m)
  n_secteurs: 8                  # secteurs de 45° centrés sur les azimuts des caméras
  hauteurs_m: [2, 4, 6, 8, 10]   # au-dessus de la surface opaque (toits : 2-4 m, mâts : 4-10 m)
  test:
    marge_m: 50                  # bloc test = emprise du site + marge
    tampon_m: 30                 # bande exclue autour du bloc test (autocorrélation des étiquettes)
  validation:
    tuile_m: 100                 # tuiles tirées au hasard hors tampon
    part: 0.15
  echantillonnage:
    n_observateurs: 30000        # entraînement + validation
    proportions: {toit: 0.25, sol_degage: 0.40, sol_vegetation: 0.35}
  test_pas_px: 2                 # bloc test calculé exactement un pixel sur deux
  horizons:                      # horizons denses par pyramide log-polaire (src/horizons.py, 6.1)
    bandes_m: [0, 10, 25, 50, 100, 150]   # mêmes bandes que B1
    pas_px: [1, 3, 5, 9, 15]     # côté des blocs (impair) par bande : ≈ constant en nombre de blocs
  reseau:                        # src/surrogate.py (étape 5.3)
    base: 16                     # canaux du premier niveau
    niveaux: 4                   # 1, 2, 4, 8, 16 m
    dilatations: [2]             # goulot : champ récepteur = 301 px = 2R + 1 (vérifié par un test)
    tuile_px: 512                # intérieur étiqueté = 512 − 2 × 151 = 210 px
    lot: 4
    iterations: 3000
    lr: 2.0e-3                   # OneCycle
    eval_tous: 250               # EAM de validation sur la grille complète
  reseau_physique:               # src/surrogate_physique.py (étape 6.1) : horizons en entrée
    base: 32
    niveaux: 3                   # champ récepteur 85 px : le contexte lointain est dans les horizons
    dilatations: []
    tuile_px: 256                # intérieur étiqueté = 256 − 2 × 43 = 170 px
    lot: 8
    iterations: 3000
    lr: 2.0e-3
    eval_tous: 250
  decision:                      # validation par la décision (src/catalogue_surrogate.py, 6.3)
    nms_m: 10                    # espacement minimal entre positions retenues (par type)
    graine_aleatoire: 42         # catalogue témoin tiré au hasard
    population: 100              # NSGA-II amorcé par les solutions gloutonnes du catalogue
    generations: 100
    graines: [1]
    reduit:                      # catalogues réduits (src/catalogue_reduit.py, 6.3c)
      tailles: [5, 10, 20]       # nombre de positions, même proportion mâts / toits que le manuel
      graines: [1, 2, 3, 4, 5]   # tirages aléatoires et sous-catalogues manuels
      # --- 6.3d : protocole préenregistré (fixé AVANT exécution, ne pas modifier après coup)
      protocole: "preenregistre" # "initial" (6.3c) ou "preenregistre" (6.3d)
      tailles_preenregistre: [5, 10, 15, 20]
      facteur_espacement: 0.5    # R = 0,5 · √(A_type / K_type)
      masse_bande: 1.0           # masse de la bande extérieure = masse intérieure
