project:
  name: "lidar-project"
  random_seed: 42

paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"

lidar:
  crs: "EPSG:2950"
  vertical_datum: "CGVD28"   # to be confirmed in step 3
  data_extent: [295000, 5039000, 297000, 5041000]

site:
  gpkg: "data/site/site.gpkg"                 # drawn in QGIS (input)
  output_gpkg: "data/site/site_derived.gpkg"  # generated (output)
  grid_yaml: "data/site/grid.yaml"            # study extent snapped to the grid (output)
  weights_csv: "data/site/weights.csv"
  figure: "data/site/site.png"
  approach_ring_m: 15      # width of the approach ring around the assets
  study_buffer_m: "auto"   # max sensor range + margin: min(study_buffer_max_m, distance to the tile edge)
  study_buffer_max_m: 400  # (>= intruder.outer_band_m + 20 m, otherwise the site is rejected)
  resolution_m: 1.0        # raster resolution
  tolerance_m: 0.5         # geometric tolerance of the checks

rasters:
  tiles_glob: "data/raw/*.LAZ"
  out_dir: "data/processed/rasters"
  chunk_size: 5000000
  fill_max_distance_px: 100     # max radius for filling holes in the DTM/DSM
  classes:
    ground: [2]
    building: [6]
    other: [1]                  # vegetation + objects (not separated by the MRNF)
    bridge: [17]
    noise: [7]                  # excluded from every product

validation:
  out_dir: "data/processed/validation"
  margin_m: 50                   # margin around the perimeter for the PDAL test area
  pdal_ref: "data/processed/validation/dtm_pdal.tif"
  mrnf_ref: "data/external/dtm_mrnf.tif"   # DTM tile downloaded from the MRNF map

candidates:
  output: "data/site/candidates.gpkg"
  mast:
    spacing_perimeter_m: 20      # mast spacing along the fence
    inset_m: 1.0                 # setback towards the inside of the fence
    spacing_interior_m: 25       # grid of interior masts
    min_dist_building_m: 2.0
    heights_m: [4, 6, 8, 10]
    cost_base: 1.0
    cost_per_m: 0.10
  roof:
    inset_m: 1.5                 # setback from the roof edge
    simplify_m: 2.0              # footprint simplification -> corners
    heights_m: [2, 4]
    cost_base: 0.8
    cost_per_m: 0.10


viewshed:
  radius_m: 400            # max sensor range (clipped to the grid)
  target_height_m: 1.0     # torso centre of a standing intruder
  veg_min_h_m: 0.3         # below this threshold, "other" = ground (grass, curbs)
  out_dir: "data/processed/viewshed"


sensors:
  cameras_only: false      # true: no radar anywhere in the chain (rerun from src.coverage onward)
  cameras:
    - {name: cam_wide,     n_h: 1920, n_v: 1080, hfov_deg: 90, ppm_50: 25.0, alpha: 1.0, cost: 1.0}
    - {name: cam_standard, n_h: 1920, n_v: 1080, hfov_deg: 60, ppm_50: 25.0, alpha: 1.0, cost: 1.0}
    - {name: cam_tele,     n_h: 1920, n_v: 1080, hfov_deg: 30, ppm_50: 25.0, alpha: 1.0, cost: 1.3}
  camera_azimuths_deg: [0, 45, 90, 135, 180, 225, 270, 315]
  radars:
    - {name: radar_perimeter, r90_m: 150.0, p_fa: 1.0e-6, elev_max_deg: 15.0, alpha: 0.3, cost: 5.0}
  radar_tilts_deg: [0,5,10,15]

coverage:
  p_min: 0.01                    # P < p_min -> 0 in the sparse matrix (measured loss)
  out_dir: "data/processed/coverage"


optimization:
  out_dir: "data/processed/optim"
  figures_dir: "figures"         # versioned figures (used in the README)
  support_capacity:              # max number of sensors per support (c, h)
    radar: 1
    camera: 4
  budget:
    min: 2.0
    max: 40.0
    step: 1.0
  analysis_budgets: [4, 13, 30]  # budgets mapped by src.analysis
  milp:                          # multi-block submodular cuts (src/milp.py)
    block_m: 10.0                # side of the spatial blocks: smaller = stronger cuts, bigger master
    target_gap: 5.0e-3           # stop when (UB - LB) / UB <= 0.5 %
    master_time_s: 120           # limit per master solve
    max_time_s: 900              # limit per budget


intruder:                        # evaluation by the intruder (docs/formulation.md, §7)
  out_dir: "data/processed/intruder"
  outer_band_m: 30.0             # outer band included in the domain (0 = degenerate case §7.1)
  target_contact_m: 1.5          # target = interior cells closer than d_t to the intruder_target asset
  speed_m_s: 1.5                 # walking
  tau_obs_s: 1.0                 # interval between independent observations (assumption)
  tau_obs_sensitivity_s: [0.5, 1.0, 5.0]
  t_fence_s: 10.0                # time to climb the fence, exposed (assumption)
  t_gate_s: 3.0                  # time to get through a closed gate (assumption)
  pi_gate: 0.8                   # share of opportunistic intruders (gates only), assumption
  t_response_s: [0, 10, 20, 30, 45, 60, 120]   # response time T_R, timely detection (§9.1), assumptions
  nsga_objective: "worst_case"   # "worst_case" (p*_F) or "mixture" (D_pi), see §7.3


nsga:                            # multi-objective NSGA-II (src/nsga.py, step 4.5)
  out_dir: "data/processed/nsga"
  population: 100
  generations: 200
  seeds: [1, 2, 3, 4, 5]
  p_crossover: 0.9
  seed_with_week3: true          # the MILP and greedy solutions (src.greedy, src.milp)
  k_coverage:                    # equipment seen by >= k sensors at P >= p_min on min_share of the cells
    k: 2
    p_min: 0.5
    min_share: 0.9
    zones: "equipment"           # approach rings of the equipment (else the target), or indices / names
    constraint: false            # true: NSGA-II constraint; false: indicator only


loop:                            # exact adversarial loop by path generation (§9.2)
  out_dir: "data/processed/loop"
  profile: "F"                   # reference threat: determined intruder
  theta: [0.5, 0.9, 0.95]        # required guaranteed timely detection
  t_response_s: [0, 10, 20, 30]  # beyond T_min: infeasible (§9.1, proposition 2)
  theta_product: [0.9]           # cases where the optimum is also bracketed under independence
  paths_per_iteration: 20        # disjoint corridors returned by the intruder at each iteration
  master_time_s: 300
  max_time_s: 1800               # per case, "max" fusion (certified optimum)
  product_time_s: 600            # per case, "product" fusion (bracket)
  price:                         # certified price of robustness: max free F vs max robust F
    - {budget: 16, theta: 0.95, t_response_s: 0}
    - {budget: 19, theta: 0.95, t_response_s: 0}
    - {budget: 20, theta: 0.9, t_response_s: 10}
    - {budget: 30, theta: 0.9, t_response_s: 20}

sensitivity:                     # sensitivity analysis by decision regret (§9.3), preregistered
  out_dir: "data/processed/sensitivity"
  theta: 0.9
  decisions_t_response_s: [0, 10] # nominal decisions: certified optimum of the loop ("max" fusion)
  stable_threshold: 0.10         # stable: holds everywhere and regret < 10 % of its cost
  delay:                         # (t_c, t_p): fence climb, gate passage (s)
    - [10, 3]                    # nominal
    - [30, 3]                    # reinforced fence only
    - [30, 30]                   # reinforced fence and gates
    - [60, 60]
    - [120, 120]
  delay_t_response_s: [10, 30, 60, 120]
  speed_m_s: [1.0, 3.0]          # nominal 1.5 (walking); 3.0 = running
  outer_band_m: [15, 50]         # nominal 30; rebuilds the domain and A_intruder
  foliage: [2, 4]                # α × f for every sensor (k × f, leaves); rebuilds A_intruder
  max_time_s: 1200               # per solve

surrogate:                       # surrogate model: potential map (docs/formulation.md, §8)
  out_dir: "data/processed/surrogate"
  radius_m: 150                  # R: useful range (radar R90, tele camera ≈ 143 m)
  rings_m: [0, 50, 150]          # distance rings (wide ≈ 38 m, standard ≈ 67 m)
  n_sectors: 8                   # 45° sectors centred on the camera azimuths
  heights_m: [2, 4, 6, 8, 10]    # above the opaque surface (roofs: 2-4 m, masts: 4-10 m)
  test:
    margin_m: 50                 # test block = site extent + margin
    buffer_m: 30                 # band excluded around the test block (label autocorrelation)
  validation:
    tile_m: 100                  # tiles drawn at random outside the buffer
    share: 0.15
  sampling:
    n_observers: 30000           # training + validation
    proportions: {roof: 0.25, open_ground: 0.40, vegetated_ground: 0.35}
  test_step_px: 2                # test block computed exactly one pixel out of two
  horizons:                      # dense horizons by log-polar pyramid (src/horizons.py, 6.1)
    bands_m: [0, 10, 25, 50, 100, 150]   # same bands as B1
    step_px: [1, 3, 5, 9, 15]    # block side (odd) per band: ≈ constant number of blocks
  network:                       # src/surrogate.py (step 5.3)
    base: 16                     # channels of the first level
    levels: 4                    # 1, 2, 4, 8, 16 m
    dilations: [2]               # bottleneck: receptive field = 301 px = 2R + 1 (checked by a test)
    tile_px: 512                 # labelled interior = 512 - 2 × 151 = 210 px
    batch: 4
    iterations: 3000
    lr: 2.0e-3                   # OneCycle
    eval_every: 250              # validation MAE on the full grid
  physics_network:               # src/surrogate_physics.py (step 6.1): horizons as input
    base: 32
    levels: 3                    # receptive field 85 px: the far context is in the horizons
    dilations: []
    tile_px: 256                 # labelled interior = 256 - 2 × 43 = 170 px
    batch: 8
    iterations: 3000
    lr: 2.0e-3
    eval_every: 250
  decision:                      # validation by the decision (src/surrogate_catalog.py, 6.3)
    nms_m: 10                    # minimal spacing between selected positions (per type)
    random_seed: 42              # control catalog drawn at random
    population: 100              # NSGA-II seeded with the greedy solutions of the catalog
    generations: 100
    seeds: [1]
    reduced:                     # reduced catalogs (src/reduced_catalog.py, 6.3c)
      sizes: [5, 10, 20]         # number of positions, same mast / roof ratio as the manual catalog
      seeds: [1, 2, 3, 4, 5]     # random draws and manual sub-catalogs
      # --- 6.3d: preregistered protocol (fixed BEFORE running, do not change afterwards)
      protocol: "preregistered"  # "initial" (6.3c) or "preregistered" (6.3d)
      preregistered_sizes: [5, 10, 15, 20]
      spacing_factor: 0.5        # R = 0.5 · √(A_type / K_type)
      band_mass: 1.0             # mass of the outer band = interior mass
