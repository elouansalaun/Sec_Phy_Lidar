project:
  name: "lidar-project"
  random_seed: 42

paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"

lidar:
  crs: "EPSG:2950"
  vertical_datum: "CGVD28"   # à confirmer à l'étape 3
  data_extent: [295000, 5039000, 297000, 5041000]

site:
  gpkg: "data/site/site.gpkg"               # dessiné dans QGIS (entrée)
  output_gpkg: "data/site/site_derive.gpkg" # généré (sortie)
  grid_yaml: "data/site/grid.yaml"          # emprise calée sur la grille (sortie)
  weights_csv: "data/site/poids.csv"
  figure: "data/site/site.png"
  approach_ring_m: 15      # largeur de l'anneau d'approche autour des actifs
  study_buffer_m: 400      # portée max capteurs + marge
  resolution_m: 1.0        # résolution des rasters
  tolerance_m: 0.5         # tolérance géométrique des contrôles

rasters:
  tiles_glob: "data/raw/*.LAZ"
  out_dir: "data/processed/rasters"
  chunk_size: 5000000
  fill_max_distance_px: 100     # rayon max de comblement des trous du MNT/MNS
  classes:
    sol: [2]
    batiment: [6]
    autre: [1]                  # végétation + objets (non séparés par le MRNF)
    pont: [17]
    bruit: [7]                  # exclu de tous les produits

validation:
  out_dir: "data/processed/validation"
  margin_m: 50                   # marge autour du périmètre pour la zone de test PDAL
  pdal_ref: "data/processed/validation/mnt_pdal.tif"
  mrnf_ref: "data/external/mnt_mrnf.tif"   # tuile MNT téléchargée sur la carte du MRNF

candidates:
  output: "data/site/candidats.gpkg"
  mat:
    spacing_perimeter_m: 20      # espacement des mâts le long de la clôture
    inset_m: 1.0                 # recul vers l'intérieur de la clôture
    spacing_interior_m: 25       # grille de mâts à l'intérieur
    min_dist_building_m: 2.0
    heights_m: [4, 6, 8, 10]
    cost_base: 1.0
    cost_per_m: 0.10
  toit:
    inset_m: 1.5                 # recul depuis le bord du toit
    simplify_m: 2.0              # simplification des emprises -> coins
    heights_m: [2, 4]
    cost_base: 0.8
    cost_per_m: 0.10



viewshed:
  radius_m: 400            # portée max des capteurs (= study_buffer_m)
  target_height_m: 1.0     # centre du torse d'un intrus debout
  veg_min_h_m: 0.3         # sous ce seuil, "autre" = sol (herbe, bordures)
  out_dir: "data/processed/viewshed"


sensors:
  cameras:
    - {name: cam_grand_angle, n_h: 1920, n_v: 1080, hfov_deg: 90, ppm_50: 25.0, alpha: 1.0, cost: 1.0}
    - {name: cam_standard,    n_h: 1920, n_v: 1080, hfov_deg: 60, ppm_50: 25.0, alpha: 1.0, cost: 1.0}
    - {name: cam_tele,        n_h: 1920, n_v: 1080, hfov_deg: 30, ppm_50: 25.0, alpha: 1.0, cost: 1.3}
  camera_azimuths_deg: [0, 45, 90, 135, 180, 225, 270, 315]
  radars:
    - {name: radar_perimetre, r90_m: 150.0, p_fa: 1.0e-6, elev_max_deg: 15.0, alpha: 0.3, cost: 5.0}
  radar_tilts_deg: [0,5,10,15]

coverage:
  p_min: 0.01                    # P < p_min -> 0 dans la matrice creuse (perte mesurée)
  out_dir: "data/processed/coverage"


optimisation:
  out_dir: "data/processed/optim"
  capacite_support:            # nombre max de capteurs par support (c, h)
    radar: 1
    camera: 4
  budget:
    min: 2.0
    max: 30.0
    pas: 1.0
  analyse_budgets: [4, 13, 30]  # budgets cartographiés par src.analyse
  milp:                        # coupes sous-modulaires multi-blocs (src/milp.py)
    bloc_m: 10.0                 # côté des blocs spatiaux : plus petit = coupes plus fortes, maître plus gros
    ecart_cible: 5.0e-3          # arrêt quand (UB − LB) / UB ≤ 0,5 %
    temps_maitre_s: 120          # limite par résolution du maître
    temps_max_s: 900             # limite par budget